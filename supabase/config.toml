
[functions.submit-application]
enabled = true
# Public enrollment has no user session. Gateway JWT checks would reject
# the publishable key (it is not a user JWT) before the function runs.
verify_jwt = false
import_map = "./functions/submit-application/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/submit-application/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/submit-application/*.html" ]

[functions.admin-application-document]
enabled = true
# The handler validates the user JWT with Auth and checks public.admin_users.
# This avoids the legacy gateway verifier while keeping document access private.
verify_jwt = false
import_map = "./functions/admin-application-document/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/admin-application-document/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/admin-application-document/*.html" ]
